plugins {
    id 'com.android.application'
}

// Pass -PgbastationAbis=arm64-v8a (or a comma-separated list) to limit a
// local/CI build. Without it, releases include both supported Android ABIs.
def gbastationAbis = (findProperty('gbastationAbis') ?: 'armeabi-v7a,arm64-v8a')
    .split(',')
    .collect { it.trim() }
    .findAll { !it.isEmpty() }

android {
    namespace = 'com.beiklive.gbastation'
    compileSdk = 36
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = 'com.beiklive.gbastation'
        // API 24 exposes fseeko/ftello in bionic, required for Snes9x ZIP64 save and ROM support.
        minSdk = 24
        targetSdk = 36
        versionCode = 3012
        versionName = '0.3.12'

        externalNativeBuild {
            cmake {
                arguments '-DPLATFORM_ANDROID=ON',
                          '-DANDROID_STL=c++_shared',
                          '-DCMAKE_WARN_DEPRECATED=FALSE'
                abiFilters(*gbastationAbis)
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../../third_party/borealis/library/lib/extern/SDL/android-project/app/src/main/java']
        }
    }

    externalNativeBuild {
        cmake {
            path = file('jni/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
